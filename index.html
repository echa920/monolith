<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08090B">
<title>MONOLITH</title>

<!-- installable: tap the icon on a home screen and it opens full-screen -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<!-- iOS ignores the manifest and reads these instead -->
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MONOLITH">
<meta name="mobile-web-app-capable" content="yes">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#08090B; --bg2:#0D0F13; --surf:#12151A; --surf2:#171B22; --line:#232830;
  --tx:#E9ECF1; --mut:#8B93A1; --dim:#5C6472;
  --acc:#C8FF00; --acc2:#9BC400; --good:#38DC84; --warn:#FFB020; --bad:#FF4A3D;
  --up:#00D6FF; --lg:#FF6B2C; --pl:#A78BFA;
  --r:14px; --mono:ui-monospace,"Cascadia Mono","Consolas",monospace;
}
html,body{height:100%}
body{
  background:var(--bg); color:var(--tx);
  font-family:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif;
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(1100px 520px at 50% -12%,rgba(200,255,0,.07),transparent 62%)}
#app{position:relative;z-index:1;max-width:960px;margin:0 auto;padding:0 14px 130px}
h1,h2,h3,h4{letter-spacing:-.02em;line-height:1.15;font-weight:800}
.mono{font-family:var(--mono)}

header{position:sticky;top:0;z-index:40;background:rgba(8,9,11,.86);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);margin:0 -14px;padding:12px 14px 0}
.brandrow{display:flex;align-items:center;gap:12px;justify-content:space-between}
.brand{display:flex;align-items:baseline;gap:9px}
.brand b{font-size:21px;font-weight:900;letter-spacing:.22em;text-transform:uppercase}
.brand b i{font-style:normal;color:var(--acc)}
.brand span{font-size:9.5px;color:var(--dim);letter-spacing:.28em;text-transform:uppercase}
.langbtn{font-family:var(--mono);font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--mut);
  border:1px solid var(--line);background:var(--bg2);border-radius:99px;padding:5px 11px;cursor:pointer}
.langbtn:hover{color:var(--tx);border-color:var(--dim)}
.wkbadge{font-family:var(--mono);font-size:11px;color:var(--acc);border:1px solid rgba(200,255,0,.35);
  background:rgba(200,255,0,.07);padding:5px 10px;border-radius:99px;white-space:nowrap;text-transform:uppercase;letter-spacing:.1em}
nav{display:flex;gap:4px;overflow-x:auto;padding:11px 0 0;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{background:none;border:0;color:var(--dim);font:inherit;font-size:12.5px;font-weight:700;
  letter-spacing:.11em;text-transform:uppercase;padding:9px 12px 12px;cursor:pointer;white-space:nowrap;
  border-bottom:2px solid transparent;transition:color .15s,border-color .15s}
nav button:hover{color:var(--mut)}
nav button.on{color:var(--acc);border-bottom-color:var(--acc)}

.view{display:none;padding-top:20px;animation:fade .22s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.card{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px}
.card.flat{background:var(--bg2)}
.card.acc{border-color:rgba(200,255,0,.3);background:linear-gradient(180deg,rgba(200,255,0,.06),transparent 60%),var(--surf)}
.sec-t{font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim);font-weight:800;margin-bottom:12px}
.h-lg{font-size:clamp(28px,7vw,42px);font-weight:900;letter-spacing:-.035em;text-transform:uppercase;line-height:.95}
.h-md{font-size:19px;font-weight:800;margin-bottom:4px}
.sub{color:var(--mut);font-size:13.5px}
.tiny{font-size:11.5px;color:var(--dim)}
.hr{height:1px;background:var(--line);margin:16px 0;border:0}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px}
.grid{display:grid;gap:10px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:620px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}}

button.btn{font:inherit;font-weight:800;font-size:13px;letter-spacing:.09em;text-transform:uppercase;
  background:var(--surf2);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:12px 16px;
  cursor:pointer;transition:.14s;display:inline-flex;align-items:center;gap:8px;justify-content:center}
button.btn:hover{border-color:var(--dim);background:#1D222A}
button.btn.p{background:var(--acc);color:#0A0C05;border-color:var(--acc)}
button.btn.p:hover{background:#D9FF3D}
button.btn.gh{background:transparent}
button.btn.sm{padding:8px 12px;font-size:11.5px;border-radius:8px}
button.btn.w{width:100%}
button.btn.danger{color:var(--bad);border-color:rgba(255,74,61,.35)}
button.btn:disabled{opacity:.4;cursor:not-allowed}
input,select,textarea{font:inherit;background:var(--bg2);color:var(--tx);border:1px solid var(--line);
  border-radius:9px;padding:11px 12px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--acc2)}
input[type=number]{font-family:var(--mono);text-align:center}
label.f>span{display:block;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin-bottom:5px;font-weight:700}

.daytag{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11px;
  letter-spacing:.14em;text-transform:uppercase;padding:5px 10px;border-radius:99px;border:1px solid}
.t-up{color:var(--up);border-color:rgba(0,214,255,.35);background:rgba(0,214,255,.08)}
.t-pl{color:var(--pl);border-color:rgba(167,139,250,.38);background:rgba(167,139,250,.1)}
.t-lg{color:var(--lg);border-color:rgba(255,107,44,.35);background:rgba(255,107,44,.08)}
.t-rest{color:var(--dim);border-color:var(--line);background:var(--surf)}

.ex{border:1px solid var(--line);border-radius:12px;background:var(--bg2);margin-bottom:10px;overflow:hidden}
.ex.done{border-color:rgba(56,220,132,.32)}
.ex-h{display:flex;gap:12px;align-items:flex-start;padding:14px;cursor:pointer}
.ex-n{width:26px;height:26px;flex:0 0 26px;border-radius:7px;background:var(--surf2);color:var(--mut);
  font-family:var(--mono);font-size:12px;font-weight:700;display:grid;place-items:center;margin-top:1px}
.ex.done .ex-n{background:rgba(56,220,132,.15);color:var(--good)}
.ex-t{flex:1;min-width:0}
.ex-t b{display:block;font-size:15px;font-weight:800;letter-spacing:-.01em}
.ex-meta{font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:3px;letter-spacing:.04em}
.chev{color:var(--dim);font-size:12px;transition:transform .2s}
.ex.open .chev{transform:rotate(90deg)}
.ex-b{display:none;padding:14px;border-top:1px solid var(--line)}
.ex.open .ex-b{display:block}
.setrow{display:grid;grid-template-columns:32px 1fr 1fr 1fr 40px;gap:7px;align-items:center;margin-bottom:7px}
.setrow>.sn{font-family:var(--mono);font-size:11px;color:var(--dim);text-align:center}
.setrow input{padding:9px 4px;font-size:14px}
.setrow .ok{background:var(--surf2);border:1px solid var(--line);border-radius:8px;height:38px;
  display:grid;place-items:center;cursor:pointer;color:var(--dim);font-size:14px}
.setrow .ok.on{background:rgba(56,220,132,.16);border-color:rgba(56,220,132,.4);color:var(--good)}
.colh{display:grid;grid-template-columns:32px 1fr 1fr 1fr 40px;gap:7px;margin-bottom:6px}
.colh div{font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--dim);text-align:center;font-weight:700}
.cue{font-size:13px;color:var(--mut);margin:4px 0 4px 16px;position:relative}
.cue::before{content:"";position:absolute;left:-13px;top:8px;width:5px;height:5px;border-radius:50%;background:var(--acc2)}
.cue.bad::before{background:var(--bad)}
.pill{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  padding:3px 8px;border-radius:99px;border:1px solid var(--line);color:var(--mut);background:var(--surf)}
.pill.up{color:var(--acc);border-color:rgba(200,255,0,.4);background:rgba(200,255,0,.1)}
.pill.good{color:var(--good);border-color:rgba(56,220,132,.35);background:rgba(56,220,132,.1)}
.pill.warn{color:var(--warn);border-color:rgba(255,176,32,.35);background:rgba(255,176,32,.1)}

.chk{display:flex;gap:11px;align-items:center;padding:11px 12px;border:1px solid var(--line);
  border-radius:10px;background:var(--bg2);cursor:pointer;margin-bottom:7px;transition:.14s}
.chk:hover{border-color:var(--dim)}
.chk.on{border-color:rgba(56,220,132,.4);background:rgba(56,220,132,.07)}
.box{width:19px;height:19px;flex:0 0 19px;border:1.5px solid var(--dim);border-radius:5px;display:grid;place-items:center;font-size:12px;color:transparent}
.chk.on .box{background:var(--good);border-color:var(--good);color:#062;font-weight:900}
.chk span{font-size:13.5px}
.chk.on span{color:var(--mut)}
/* --- strength ranks --- */
.tier{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  font-weight:800;padding:4px 11px;border-radius:99px;border:1px solid;white-space:nowrap}
.tier.big{font-size:20px;letter-spacing:.08em;padding:9px 20px;border-width:2px}
.ladder{display:flex;flex-direction:column;gap:8px}
.rung{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:10px;border:1px solid transparent}
.rung.on{border-color:var(--line);background:var(--bg2)}
.rung .tiny{flex:1;min-width:0}
.lrow{padding:12px 0;border-bottom:1px solid var(--line)}
.lrow:last-child{border-bottom:none}
/* --- monolith ai --- */
.msg{margin-bottom:12px;display:flex}
.msg.me{justify-content:flex-end}
.msg .mtxt{max-width:86%;padding:12px 14px;border-radius:14px;font-size:14px;line-height:1.5}
.msg.me .mtxt{background:rgba(200,255,0,.12);border:1px solid rgba(200,255,0,.3);border-bottom-right-radius:4px}
.msg.ai .mtxt{background:var(--surf);border:1px solid var(--line);border-bottom-left-radius:4px;color:var(--tx)}
.msg.ai{flex-direction:column;align-items:flex-start}
.planbox{margin-top:8px;max-width:86%;width:100%;background:var(--bg2);border:1px solid rgba(200,255,0,.3);border-radius:12px;padding:12px}
.msg .mtxt .cue{margin:5px 0}
.engines{display:flex;gap:6px;flex-wrap:wrap}
.engines button{font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;padding:7px 11px;border-radius:9px;
  border:1px solid var(--line);background:var(--bg2);color:var(--dim);cursor:pointer;white-space:nowrap}
.engines button.on{border-color:var(--acc);background:rgba(200,255,0,.12);color:var(--acc);font-weight:700}
.engines button:disabled{opacity:.4;cursor:not-allowed}
/* --- device sync --- */
.syncrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.syncdot{width:9px;height:9px;border-radius:50%;background:var(--dim);flex:0 0 9px}
.syncdot.on{background:var(--good)}
.syncdot.busy{background:var(--warn)}
/* --- your own photo on an exercise --- */
.exph{position:relative;border-radius:8px;overflow:hidden;background:#0E1219;min-height:90px}
.exph img{display:block;width:100%;height:auto}
.exph-tag{position:absolute;top:6px;left:6px;font-family:var(--mono);font-size:8.5px;letter-spacing:.14em;
  background:rgba(10,14,20,.8);color:var(--acc);padding:3px 7px;border-radius:99px}
.exph-btns{display:flex;gap:5px;margin-top:7px}
.exph-btns .btn{padding:6px 9px;font-size:12px;line-height:1;min-height:0}
/* --- technique diagrams --- */
.howto{margin:14px 0 0}
.howto-t{font-size:9.5px;letter-spacing:.17em;text-transform:uppercase;color:var(--dim);font-weight:700;margin-bottom:9px}
.frames{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.frames figure{background:var(--bg2);border:1px solid var(--line);border-radius:11px;padding:9px;margin:0;min-width:0}
.fr-n{font-family:var(--mono);font-size:9px;letter-spacing:.14em;color:var(--acc);font-weight:800;margin-bottom:4px}
.frames figcaption{font-size:12px;color:var(--tx);line-height:1.4;margin-top:7px}
.posefig{display:block;width:100%;height:auto;background:#0E1219;border-radius:8px}
.bodymap{display:block;width:100%;height:auto;max-height:330px;background:#0E1219;border-radius:8px}
.mlegend{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.mtag{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;
  padding:3px 8px;border-radius:99px;border:1px solid var(--line);color:var(--mut)}
.mtag.p{color:var(--acc);border-color:rgba(200,255,0,.4);background:rgba(200,255,0,.1);font-weight:700}
.mtag.s{color:var(--up);border-color:rgba(0,214,255,.35);background:rgba(0,214,255,.08)}
/* on a phone the two frames side by side are too small to read, so they stack */
@media(max-width:620px){.frames{grid-template-columns:1fr}}
/* --- schedule & session editors --- */
.drow{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.drow:last-child{border-bottom:none}
.drow.off .dname{color:var(--dim)}
.dname{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--tx);width:44px;flex:0 0 44px;font-weight:700}
.dopts{display:flex;gap:5px;flex-wrap:wrap;flex:1}
.dopts button{font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;padding:6px 9px;border-radius:8px;
  border:1px solid var(--line);background:var(--bg2);color:var(--dim);cursor:pointer;white-space:nowrap}
.dopts button:hover{color:var(--tx)}
.dopts button.on{border-color:var(--acc);background:rgba(200,255,0,.12);color:var(--acc);font-weight:700}
.erow{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
.erow:last-of-type{border-bottom:none}
.erow .en{flex:1;min-width:0}
.erow .en b{display:block;font-size:13.5px;font-weight:700;line-height:1.25}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:0 0 auto}
.stepper button{width:25px;height:26px;background:var(--bg2);border:none;color:var(--tx);cursor:pointer;font-size:15px;line-height:1;padding:0}
.stepper button:disabled{color:var(--line);cursor:not-allowed}
.stepper span{min-width:34px;text-align:center;font-family:var(--mono);font-size:11px;font-weight:700}
.ebtn{width:26px;height:26px;flex:0 0 26px;border-radius:7px;border:1px solid var(--line);
  background:var(--bg2);color:var(--mut);cursor:pointer;font-size:12px;line-height:1;padding:0}
.ebtn:hover{color:var(--tx);border-color:var(--dim)}
.ebtn:disabled{opacity:.3;cursor:not-allowed}
.ebtn.rm:hover{color:var(--bad);border-color:rgba(255,74,61,.5)}
/* --- energy, made visible --- */
.echip{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:11px;font-weight:700;
  color:var(--acc);border:1px solid rgba(200,255,0,.38);background:rgba(200,255,0,.1);
  border-radius:99px;padding:3px 9px;white-space:nowrap;letter-spacing:.06em}
.hstrip{padding:13px 14px;margin-bottom:14px}
.ebig{font-family:var(--mono);font-size:40px;font-weight:700;line-height:1.02;color:var(--acc);letter-spacing:-.035em}
.ebig i{font-style:normal;font-size:24px}
.ledger{margin-top:15px;border-top:1px solid var(--line)}
.ledger>div{display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.ledger>div:last-child{border-bottom:none}
.ledger b{font-family:var(--mono);font-weight:700;font-size:14px;white-space:nowrap}
.ledger .pos{color:var(--good)}
.ledger .neg{color:var(--bad)}
/* --- one exercise at a time --- */
.ex.now{border-color:rgba(200,255,0,.45)}
.ex.now .ex-n{background:var(--acc);color:#0A0C00;font-weight:900}
.nowtag{display:none;font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--acc);font-weight:800;margin-top:6px}
.ex.now .nowtag{display:inline-block}
.ex-help{margin:14px 0 0!important;background:var(--surf2)}
.ex-help>summary{font-size:13px;font-weight:700;padding:11px 13px}
.ex-help>div{padding:0 13px 13px}
.jaw{border-left:2px solid var(--line);padding-left:12px;margin-bottom:16px}
.jaw.on{border-left-color:var(--good)}
.jaw .chk{margin-left:-14px}

#timer{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;z-index:60;display:none;
  background:rgba(13,15,19,.96);backdrop-filter:blur(16px);border:1px solid rgba(200,255,0,.35);
  border-radius:99px;padding:9px 10px 9px 16px;align-items:center;gap:12px;box-shadow:0 12px 40px rgba(0,0,0,.7);
  width:calc(100% - 28px);max-width:420px}
#timer.on{display:flex}
#timer .tt{font-family:var(--mono);font-size:26px;font-weight:700;letter-spacing:-.02em;min-width:70px}
#timer .tl{flex:1;min-width:0}
#timer .tl div:first-child{font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);font-weight:800}
#timer .tl div:last-child{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#timer.ring{border-color:var(--good)}
.bar{height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--acc);border-radius:2px;transition:width .35s}

.stat{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:14px}
.stat .v{font-family:var(--mono);font-size:25px;font-weight:700;letter-spacing:-.03em;line-height:1}
.stat .k{font-size:9.5px;letter-spacing:.17em;text-transform:uppercase;color:var(--dim);font-weight:700;margin-top:7px}
.stat .d{font-size:11px;color:var(--mut);margin-top:3px}

.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:520px}
th{background:var(--bg2);color:var(--dim);font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;
  text-align:left;padding:11px 12px;font-weight:800;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid rgba(35,40,48,.6);vertical-align:top}
tr:last-child td{border-bottom:0}
td.m{font-family:var(--mono);font-size:12px;color:var(--mut);white-space:nowrap}
tr.grp td{background:var(--bg2);font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:10px;color:var(--acc)}

.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.ph{position:relative;border-radius:11px;overflow:hidden;border:1px solid var(--line);background:var(--bg2);aspect-ratio:3/4;cursor:pointer}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .cap{position:absolute;left:0;right:0;bottom:0;padding:16px 9px 7px;
  background:linear-gradient(transparent,rgba(0,0,0,.9));font-family:var(--mono);font-size:10px;letter-spacing:.06em}
.ph .pose{position:absolute;top:7px;left:7px;font-family:var(--mono);font-size:9px;letter-spacing:.1em;
  text-transform:uppercase;background:rgba(8,9,11,.82);border:1px solid var(--line);padding:3px 7px;border-radius:99px}
.ph .mk{position:absolute;top:7px;right:7px;font-size:10px;color:var(--acc)}
.drop{border:1.5px dashed var(--line);border-radius:12px;padding:24px 16px;text-align:center;color:var(--dim);cursor:pointer;transition:.15s}
.drop:hover{border-color:var(--acc2);color:var(--mut)}
#markwrap{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#000;touch-action:none}
#markcv{display:block;width:100%;height:auto;cursor:crosshair}
.modal{position:fixed;inset:0;z-index:80;background:rgba(4,5,7,.9);backdrop-filter:blur(8px);
  display:none;align-items:center;justify-content:center;padding:16px}
.modal.on{display:flex}
.modal .in{background:var(--surf);border:1px solid var(--line);border-radius:16px;max-width:640px;width:100%;
  max-height:92vh;overflow:auto;padding:18px}
.modal.sm .in{max-width:340px;padding:16px}
.chk.sm{padding:8px 10px;margin-bottom:6px}
.chk.sm .box{width:19px;height:19px;flex:0 0 19px;font-size:11px}
.chk.sm span{font-size:12.5px;line-height:1.35}
.gauge{height:9px;border-radius:99px;background:var(--surf2);overflow:hidden}
.gauge>i{display:block;height:100%;border-radius:99px;transition:width .5s}
.note{border-left:2px solid var(--acc);background:rgba(200,255,0,.05);padding:11px 13px;border-radius:0 9px 9px 0;font-size:13px;color:var(--mut)}
.note.w{border-color:var(--warn);background:rgba(255,176,32,.05)}
.note.b{border-color:var(--bad);background:rgba(255,74,61,.05)}
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%) translateY(20px);z-index:90;
  background:var(--acc);color:#0A0C05;font-weight:800;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;
  padding:11px 18px;border-radius:99px;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
details.q{border:1px solid var(--line);border-radius:11px;background:var(--bg2);margin-bottom:8px;overflow:hidden}
details.q>summary{padding:13px 15px;cursor:pointer;font-weight:700;font-size:14px;list-style:none;display:flex;justify-content:space-between;gap:10px}
details.q>summary::-webkit-details-marker{display:none}
details.q>summary::after{content:"+";color:var(--acc);font-family:var(--mono)}
details.q[open]>summary::after{content:"\2212"}
details.q>div{padding:0 15px 15px;font-size:13.5px;color:var(--mut)}
details.q>div p{margin-bottom:9px}
details.q>div b{color:var(--tx)}
details.q>div ul{margin:0 0 9px 18px}
details.q>div li{margin-bottom:4px}
svg.chart{display:block;width:100%;height:auto;overflow:visible}
@media print{header,nav,#timer,.no-print{display:none!important}.view{display:block!important}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brandrow">
      <div class="brand"><b>MONO<i>LITH</i></b><span>build the frame</span></div>
      <div class="row" style="gap:8px">
        <button class="langbtn" id="langbtn" title="Cambiar idioma">ES</button>
        <div class="wkbadge" id="wkbadge">&mdash;</div>
      </div>
    </div>
    <nav id="nav"></nav>
  </header>
  <main>
    <section class="view on" id="v-today"></section>
    <section class="view" id="v-coach"></section>
<section class="view" id="v-quest"></section>
    <section class="view" id="v-photos"></section>
    <section class="view" id="v-symmetry"></section>
    <section class="view" id="v-measure"></section>
    <section class="view" id="v-progress"></section>
    <section class="view" id="v-plan"></section>
    <section class="view" id="v-guide"></section>
  </main>
</div>
<div id="timer">
  <div class="tt mono" id="tt">0:00</div>
  <div class="tl"><div id="tlab">REST</div><div id="tex">&mdash;</div></div>
  <button class="btn sm" id="tplus">+30s</button>
  <button class="btn sm p" id="tskip">Listo</button>
</div>
<input type="file" id="exfile" accept="image/*" hidden>
<div class="modal" id="modal"><div class="in" id="modalin"></div></div>
<div class="toast" id="toast"></div>
<script>
/* The service worker only registers on a secure origin — localhost counts,
   a plain http:// LAN address does not. So this is a silent upgrade: offline
   support where the browser allows it, and the app works exactly the same
   where it does not. */
if ("serviceWorker" in navigator && window.isSecureContext) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(e => console.warn("no service worker:", e.message));
  });
}
</script>
<script src="data.js"></script>
<script src="lang.js"></script>
<script src="anatomy.js"></script>
<script src="ranks.js"></script>
<script src="exphoto.js"></script>
<script src="sync.js"></script>
<script src="game.js"></script>
<script src="world.js"></script>
<script src="planner.js"></script>
<script src="coach.js"></script>
<script src="app.js"></script>
</body>
</html>
